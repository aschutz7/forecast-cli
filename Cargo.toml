[package]
name = "forecast-cli"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.105"
clap = { version = "4.6.10", features = ["derive"] }
colored = "3.1.1"
comfy-table = "8.0.1"
reqwest = { version = "0.13.5", features = ["blocking", "json"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread"] }
urlencoding = "2.1.3"
